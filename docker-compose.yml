services:
  mediawiki:
    build: .
    restart: unless-stopped
    ports:
      - "${MW_PORT:-3000}:80"
    environment:
      MEDIAWIKI_DB_HOST: mariadb
      MEDIAWIKI_DB_NAME: mediawiki
      MEDIAWIKI_DB_USER: mediawiki
      MEDIAWIKI_DB_PASSWORD: ${DB_PASSWORD}
      MW_SERVER: ${MW_SERVER:-http://localhost:3000}
      MW_ADMIN_PASSWORD: ${MW_ADMIN_PASSWORD}
      MW_SECRET_KEY: ${MW_SECRET_KEY}
      MW_UPGRADE_KEY: ${MW_UPGRADE_KEY:-}
      ALTCHA_HMAC_KEY: ${ALTCHA_HMAC_KEY}
      MW_EMAIL_CONFIRM_TO_EDIT: ${MW_EMAIL_CONFIRM_TO_EDIT:-true}
      MW_DEBUG: ${MW_DEBUG:-false}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-wiki@altered.wiki}
    volumes:
      - mediawiki_images:/var/www/html/images
      - ./config/LocalSettings.php:/etc/mediawiki/LocalSettings.php:ro
      - ./entrypoint.sh:/usr/local/bin/docker-entrypoint-custom.sh:ro
    depends_on:
      mariadb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy

  jobrunner:
    build: .
    restart: unless-stopped
    command: ["php", "/var/www/html/maintenance/run.php", "runJobs", "--wait", "--maxjobs=0"]
    environment:
      MEDIAWIKI_DB_HOST: mariadb
      MEDIAWIKI_DB_NAME: mediawiki
      MEDIAWIKI_DB_USER: mediawiki
      MEDIAWIKI_DB_PASSWORD: ${DB_PASSWORD}
      MW_SERVER: ${MW_SERVER:-http://localhost:3000}
      MW_SECRET_KEY: ${MW_SECRET_KEY}
      MW_UPGRADE_KEY: ${MW_UPGRADE_KEY:-}
      ALTCHA_HMAC_KEY: ${ALTCHA_HMAC_KEY}
      MW_EMAIL_CONFIRM_TO_EDIT: ${MW_EMAIL_CONFIRM_TO_EDIT:-true}
      MW_DEBUG: ${MW_DEBUG:-false}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-wiki@altered.wiki}
    volumes:
      - mediawiki_images:/var/www/html/images
      - ./config/LocalSettings.php:/etc/mediawiki/LocalSettings.php:ro
    depends_on:
      mediawiki:
        condition: service_started
      elasticsearch:
        condition: service_healthy

  mariadb:
    image: mariadb:lts
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: mediawiki
      MARIADB_USER: mediawiki
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: opensearchproject/opensearch:1.3.14
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 15s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mediawiki_images:
  mariadb_data:
  elasticsearch_data:

RewriteEngine On

# Rewrite anything that isn't an actual file or directory to index.php.
# This lets /Page_Name work while leaving /api.php, /load.php, /images/, etc. alone.
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
RewriteRule ^/(.*)$ /index.php/$1 [L]
